<title>Cairn Prototype</title>
<style>
/* Layout: Cairn's own single window — a quiet header, one card per screen, max 48rem —
   under a thin prototype bar that is never part of the product. Tokens are Cairn's
   src/styles/theme.css, light only, as the app is. */
:root {
  --sand-50: #faf7f2; --sand-100: #f3ede3; --sand-200: #e6dccd; --sand-300: #d3c4ae; --sand-400: #b3a189;
  --ink-900: #2f2a24; --ink-700: #4a4239; --ink-500: #6f6558; --ink-400: #8b8073;
  --moss-600: #5c7052; --moss-500: #6f8462; --moss-100: #e4ebdd;
  --amber-600: #9a7134; --amber-500: #b38845; --amber-100: #f2e7d2;
  --clay-600: #8c5f4d; --clay-500: #a5735f; --clay-100: #f0e2da;
  --proto-bg: #2f2a24; --proto-fg: #f3ede3; --proto-mute: #b3a189;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
  --ease-gentle: cubic-bezier(0.32, 0.72, 0.24, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--sand-50); color: var(--ink-700); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--clay-500); outline-offset: 2px; }

/* The prototype bar — not Cairn. */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--proto-bg); color: var(--proto-fg); font-size: 13px; }
.proto-in { max-width: 64rem; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.proto-flag { font-weight: 600; letter-spacing: .02em; }
.proto-where { color: var(--proto-mute); min-width: 0; flex: 1 1 14rem; }
.proto-where b { color: var(--proto-fg); font-weight: 500; }
.proto select, .proto button { background: transparent; border: 1px solid #6f6558; border-radius: 6px; padding: 3px 9px; color: var(--proto-fg); cursor: pointer; }
.proto select option { color: #2f2a24; background: #faf7f2; }
.proto button:hover, .proto select:hover { border-color: var(--proto-mute); }
.proto .accept[aria-pressed="true"] { background: var(--moss-600); border-color: var(--moss-600); }
.proto label.sw { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.proto-acc { color: var(--proto-mute); font-size: 12px; }

main { max-width: 48rem; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 22px; }
header.app { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.mark { font-family: var(--font-serif); font-size: 26px; color: var(--ink-900); letter-spacing: .01em; }
nav.app { display: flex; flex-wrap: wrap; gap: 2px; }
.btn { border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s var(--ease-gentle), color .2s var(--ease-gentle); }
.btn.primary { background: var(--clay-600); color: var(--sand-50); }
.btn.primary:hover { background: var(--clay-500); }
.btn.primary:disabled { background: var(--sand-300); color: var(--ink-400); cursor: default; }
.btn.quiet { background: transparent; color: var(--ink-500); padding: 7px 12px; }
.btn.quiet:hover { color: var(--ink-900); background: var(--sand-100); }
.btn.quiet[aria-current="page"] { color: var(--ink-900); background: var(--sand-100); }
.card { border: 1px solid var(--sand-200); background: rgba(255,255,255,.6); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 480px) { .card { padding: 20px; } }
@media (prefers-reduced-motion: no-preference) { .settle { animation: settle 420ms var(--ease-gentle) both; } }
@keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1, h2 { font-family: var(--font-serif); font-weight: 400; color: var(--ink-900); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.2; }
h2 { font-size: 21px; }
.reflective { font-family: var(--font-serif); line-height: 1.65; letter-spacing: .005em; }
p { margin: 0; max-width: 65ch; }
.lead { color: var(--ink-500); }
.small { font-size: 13px; color: var(--ink-500); }
.caps { font-size: 12.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); margin: 4px 0 0; }
ul.dots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.dots li { display: grid; grid-template-columns: 6px 1fr; gap: 10px; align-items: baseline; }
ul.dots li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--moss-500); transform: translateY(-2px); }
ul.dots.sand li::before { background: var(--sand-300); }
ul.dots.amber li::before { background: var(--amber-500); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.pill { display: inline-block; border-radius: 999px; padding: 3px 11px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.pill.moss { background: var(--moss-100); color: var(--moss-600); }
.pill.amber { background: var(--amber-100); color: var(--amber-600); }
.pill.sand { background: var(--sand-100); color: var(--ink-500); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 12px; }
.stat { border-top: 1px solid var(--sand-200); padding-top: 10px; }
.stat b { display: block; font-family: var(--font-serif); font-size: 22px; font-weight: 400; color: var(--ink-900); font-variant-numeric: tabular-nums; }
.wait { background: var(--amber-100); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.wait b { color: var(--ink-900); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 10px; }
.tile { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; border: 1px solid var(--sand-200); border-radius: 12px; padding: 12px 14px; background: var(--sand-50); cursor: pointer; }
.tile:has(input:checked) { border-color: var(--moss-500); background: var(--moss-100); }
.tile input { accent-color: var(--moss-600); width: 16px; height: 16px; grid-row: span 2; }
.tile .sub { font-size: 12.5px; color: var(--ink-500); }
.field { display: flex; flex-wrap: wrap; gap: 8px; }
.input { flex: 1 1 14rem; min-width: 0; border: 1px solid var(--sand-300); border-radius: 8px; padding: 9px 12px; background: var(--sand-50); }
.note-moss { color: var(--moss-600); }
.note-amber { color: var(--amber-600); }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--sand-200); }
.list > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--sand-200); min-width: 0; }
.list .tag { font-size: 12.5px; color: var(--ink-400); }
.time { font-variant-numeric: tabular-nums; color: var(--ink-500); }
.seg { display: inline-flex; background: var(--sand-100); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-size: 13.5px; color: var(--ink-500); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink-900); box-shadow: 0 1px 2px rgba(47,42,36,.08); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr 2.5rem; gap: 12px; align-items: center; }
.bar .track { height: 8px; border-radius: 4px; background: var(--sand-100); overflow: hidden; }
.bar .fill { height: 100%; background: var(--clay-500); opacity: .55; border-radius: 4px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-500); }
.cols { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 120px; }
.cols.wk { grid-template-columns: repeat(7, 1fr); gap: 10px; }
.cols div { background: var(--clay-500); opacity: .5; border-radius: 3px 3px 0 0; min-height: 2px; }
.axis { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; font-size: 11px; color: var(--ink-400); font-variant-numeric: tabular-nums; }
.axis.wk { grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--sand-200); border-radius: 10px; padding: 7px 6px; background: var(--sand-50); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.day:hover { border-color: var(--sand-400); }
.day .d { font-size: 11.5px; color: var(--ink-400); }
.day .c { font-family: var(--font-serif); font-size: 17px; color: var(--ink-900); font-variant-numeric: tabular-nums; }
.day .w { font-size: 11px; color: var(--ink-400); }
textarea.journal { width: 100%; min-height: 10rem; border: 1px solid var(--sand-300); border-radius: 12px; padding: 14px 16px; background: var(--sand-50); font-family: var(--font-serif); font-size: 17px; line-height: 1.65; resize: vertical; }
.quote { font-family: var(--font-serif); font-style: italic; color: var(--ink-500); font-size: 17px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--sand-200); border-radius: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--clay-500); background: var(--clay-100); }
.opt input { accent-color: var(--clay-600); margin-top: 4px; }
.setting { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--sand-200); }
.setting:first-of-type { border-top: 0; padding-top: 0; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toggle input { accent-color: var(--moss-600); width: 18px; height: 18px; flex: none; }
.steps { display: flex; gap: 6px; font-size: 12.5px; color: var(--ink-400); }
.steps span[aria-current="step"] { color: var(--ink-900); }
.foot { color: var(--ink-500); font-size: 13.5px; }
</style>

<div class="proto" role="region" aria-label="Prototype controls">
  <div class="proto-in">
    <span class="proto-flag">Prototype — nothing here is saved or sent</span>
    <span class="proto-where" id="proto-where"></span>
    <label class="sw"><input type="checkbox" id="proto-empty"> Start empty</label>
    <label class="sw">Jump to <select id="proto-jump" aria-label="Jump to a screen"></select></label>
    <button type="button" id="proto-comment" hidden>Comment on this screen</button>
    <button type="button" class="accept" id="proto-accept" aria-pressed="false">Accept this screen</button>
    <span class="proto-acc" id="proto-acc" aria-live="polite"></span>
  </div>
</div>

<main id="app"></main>

<script>
(function () {
  "use strict";

  // ---------- Screens: route name, what it is, which story it shows ----------
  var SCREENS = [
    { id: "choose", name: "Setup · What would you like to protect?", story: "001 US1 · 002 (built)" },
    { id: "streaks", name: "Setup · Streaks", story: "001 streaks · slice 004 (spec only)" },
    { id: "disclosure", name: "Setup · Before Cairn changes anything", story: "002 (built)" },
    { id: "protection", name: "Protection", story: "002 (built)" },
    { id: "trail", name: "What is protected", story: "002 (built)" },
    { id: "today", name: "Today", story: "002 · 003 (built)" },
    { id: "overtime", name: "Today · Over time", story: "003 slices 5a–5e (planned)" },
    { id: "day", name: "One day", story: "003 slice one-day (spec only)" },
    { id: "tonight", name: "Tonight", story: "003 write-tonight · quote (on branches)" },
    { id: "covers", name: "What Cairn covers", story: "002 (built)" },
    { id: "settings", name: "Settings", story: "001 FR-039 · 002 US4 (spec only)" },
    { id: "partner", name: "Settings · A partner", story: "001 partner flow (spec only)" },
    { id: "theirs", name: "Settings · Your history", story: "003 slice theirs (spec only)" },
    { id: "teardown", name: "This machine is as it was", story: "002 teardown (built, not wired)" }
  ];
  var byId = {}; SCREENS.forEach(function (s) { byId[s.id] = s; });

  // ---------- Seeded sample data: four weeks of one person's evenings ----------
  var CATS = [
    ["adult", "Adult", 15], ["ai", "AI", 12], ["gambling", "Gambling", 14], ["gaming", "Gaming", 15],
    ["messenger", "Messenger", 10], ["news", "News", 14], ["shopping", "Shopping", 14], ["social", "Social", 15], ["streaming", "Streaming", 15]
  ];
  var TRAIL = {
    social: ["facebook.com", "instagram.com", "reddit.com", "tiktok.com", "x.com", "twitter.com", "bsky.app", "threads.net", "pinterest.com", "tumblr.com", "snapchat.com", "linkedin.com", "mastodon.social", "vk.com", "weibo.com"],
    news: ["cnn.com", "nytimes.com", "bbc.co.uk", "theguardian.com", "reuters.com", "apnews.com", "foxnews.com", "washingtonpost.com", "nbcnews.com", "aljazeera.com", "news.google.com", "news.ycombinator.com", "bloomberg.com", "wsj.com"],
    streaming: ["youtube.com", "netflix.com", "hulu.com", "disneyplus.com", "spotify.com", "max.com", "primevideo.com", "twitch.tv", "crunchyroll.com", "peacocktv.com", "paramountplus.com", "vimeo.com", "dailymotion.com", "soundcloud.com", "pluto.tv"]
  };
  var QUOTES = [
    "The evening arrived the same way it always does, one minute after another.",
    "Somewhere a porch light is on and no one is thinking about it.",
    "The moon does not care what day of the week it is.",
    "Somewhere it is already tomorrow."
  ];
  var SITES = [["reddit.com", 9], ["youtube.com", 7], ["x.com", 5], ["instagram.com", 4], ["nytimes.com", 3], ["news.ycombinator.com", 3], ["tiktok.com", 2], ["slowforum.net", 1]];
  var HOURS = [0,0,0,0,0,0,0,1,2,3,3,2,3,4,6,6,5,3,2,3,4,4,3,1];
  var ENTRIES = [
    "Long afternoon. I kept opening a new tab without deciding to. Went for a walk at four and the rest of the day was quieter.",
    "Better than yesterday. Most of it was in the hour after the meeting, which I did not expect.",
    "Tired. Reached for things mostly out of boredom. Going to bed earlier.",
    "Good day. Cooked, called Dad, barely thought about it.",
    "The news one is the hardest. I tell myself it is staying informed.",
    "Rough evening. Noticed I reach for it when I feel behind at work."
  ];

  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function pick(r, weights) { var t = 0, i; for (i = 0; i < weights.length; i++) t += weights[i]; var x = r() * t; for (i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; } return weights.length - 1; }
  function dayKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  var NOW_H = new Date().getHours();

  function seedHistory() {
    var r = rng(20261001), days = {}, i;
    for (i = 27; i >= 0; i--) {
      var d = addDays(TODAY, -i), k = dayKey(d), n = Math.floor(r() * 11) + (d.getDay() === 0 ? 0 : 2);
      var reaches = [];
      for (var j = 0; j < n; j++) {
        var h = pick(r, HOURS);
        if (i === 0 && h > NOW_H) h = Math.max(7, NOW_H - Math.floor(r() * 3));
        reaches.push({ domain: SITES[pick(r, SITES.map(function (s) { return s[1]; }))][0], h: h, m: Math.floor(r() * 60) });
      }
      reaches.sort(function (a, b) { return a.h * 60 + a.m - (b.h * 60 + b.m); });
      days[k] = { reaches: reaches, gap: null, estimate: null, silent: false, entry: null };
      if (i > 0 && r() < 0.55) days[k].entry = ENTRIES[Math.floor(r() * ENTRIES.length)];
    }
    var gapDay = dayKey(addDays(TODAY, -4)); days[gapDay].gap = "about 3 hours";
    var silentDay = dayKey(addDays(TODAY, -9)); days[silentDay].reaches = []; days[silentDay].silent = true; days[silentDay].estimate = 6;
    days[dayKey(addDays(TODAY, -2))].entry = null;
    return days;
  }

  function fresh(empty) {
    return {
      screen: empty ? "choose" : "protection",
      status: empty ? "off" : "in_force",
      cats: empty ? {} : { social: true, news: true, streaming: true },
      edited: { social: true },
      custom: empty ? [] : ["slowforum.net"],
      pending: null,
      mode: "counted",
      streaks: false,
      streakDays: 12,
      waiting: "24 hours",
      partner: null,
      schedule: "always",
      workarounds: false,
      autostart: true,
      hideQuotes: false,
      days: empty ? {} : seedHistory(),
      kept: {},
      note: "",
      customMsg: null,
      overTab: "site",
      from: dayKey(addDays(TODAY, -27)), to: dayKey(TODAY),
      dayView: dayKey(addDays(TODAY, -1)),
      quote: QUOTES[Math.floor(Math.random() * QUOTES.length)],
      confirmTheirs: null, theirsDone: false, setupStep: 1, workaroundsAsk: false
    };
  }
  var S = fresh(false);

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function hm(r) { return String(r.h).padStart(2, "0") + ":" + String(r.m).padStart(2, "0"); }
  function on() { return S.status !== "off"; }
  function trailDomains() {
    var out = [];
    Object.keys(S.cats).forEach(function (c) { if (S.cats[c] && TRAIL[c]) TRAIL[c].forEach(function (d) { out.push([d, null]); }); });
    S.custom.forEach(function (d) { out.push([d, null]); out.push(["www." + d, "added with its root address"]); });
    return out;
  }
  function addrCount() { var n = 0; CATS.forEach(function (c) { if (S.cats[c[0]]) n += c[2]; }); return n + S.custom.length * 2; }
  function listCount() { return CATS.filter(function (c) { return S.cats[c[0]]; }).length; }
  function words(k) { var p = k.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }); }
  function short(k) { var p = k.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  function dow(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  function range() { return Object.keys(S.days).filter(function (k) { return k >= S.from && k <= S.to; }).sort(); }

  // ---------- the app shell ----------
  function header() {
    var cur = S.screen;
    function nav(id, label, show) {
      if (!show) return "";
      var here = cur === id || (id === "protection" && /^(choose|streaks|disclosure)$/.test(cur)) || (id === "today" && /^(overtime|day)$/.test(cur)) || (id === "settings" && /^(partner|theirs|teardown)$/.test(cur));
      return '<button class="btn quiet" data-go="' + id + '"' + (here ? ' aria-current="page"' : "") + ">" + label + "</button>";
    }
    return '<header class="app"><span class="mark">Cairn</span><nav class="app" aria-label="Cairn">' +
      nav(on() ? "protection" : "choose", "Protection", true).replace('data-go="choose"', 'data-go="choose"') +
      nav("trail", on() ? "What is protected" : "What you chose", on()) +
      nav("today", "Today", on()) +
      nav("tonight", "Tonight", true) +
      nav("covers", "What Cairn covers", true) +
      nav("settings", "Settings", true) +
      "</nav></header>";
  }

  // ---------- screens ----------
  var R = {};

  R.choose = function () {
    var tiles = CATS.map(function (c) {
      var ed = S.edited[c[0]] && S.cats[c[0]] ? " · edited by you" : "";
      return '<label class="tile"><input type="checkbox" data-cat="' + c[0] + '"' + (S.cats[c[0]] ? " checked" : "") + '><span>' + c[1] + '</span><span class="sub">' + c[2] + " addresses" + ed + "</span></label>";
    }).join("");
    var msg = S.customMsg ? '<p class="' + (S.customMsg[0] === "ok" ? "note-moss" : "note-amber") + '" role="status">' + esc(S.customMsg[1]) + "</p>" : "";
    return steps(1) +
      '<section class="card settle"><h1>What would you like to protect?</h1><p class="lead">Each of these is a starting list. It becomes yours — add to it, take things out of it, whenever you like.</p><div class="tiles">' + tiles + "</div>" +
      (S.note ? '<p class="note-amber" role="status">' + esc(S.note) + "</p>" : "") + "</section>" +
      '<section class="card settle"><h2>Anywhere else?</h2><p class="lead">Type an address and Cairn will protect it, along with its www. form.</p>' +
      '<form class="field" id="custom-form"><label for="custom" style="position:absolute;left:-9999px">Address to protect</label><input class="input" id="custom" placeholder="example.com" autocomplete="off"><button class="btn primary" type="submit">Protect it</button></form>' + msg +
      (S.custom.length ? '<p class="small">Yours: ' + S.custom.map(esc).join(", ") + "</p>" : "") + "</section>" +
      '<div class="row end">' + (on() ? '<button class="btn quiet" data-go="protection">Back to protection</button>' : '<button class="btn primary" data-go="streaks"' + (listCount() || S.custom.length ? "" : " disabled") + ">Turn protection on</button>") + "</div>";
  };

  function steps(n) {
    if (on()) return "";
    var names = ["What to protect", "Streaks", "Before anything changes"];
    return '<div class="steps" aria-label="Setup">' + names.map(function (x, i) { return "<span" + (i + 1 === n ? ' aria-current="step"' : "") + ">" + (i + 1) + ". " + x + "</span>"; }).join("<span>·</span>") + "</div>";
  }

  R.streaks = function () {
    return steps(2) + '<section class="card settle"><h1>Would you like a streak?</h1>' +

  R.overtime = function () {

      '<div class="row"><label class="small">From <input class="input" style="flex:none;width:auto" type="date" id="from" value="' + S.from + '" max="' + S.to + '"></label><label class="small">To <input class="input" style="flex:none;width:auto" type="date" id="to" value="' + S.to + '" max="' + dayKey(TODAY) + '"></label></div>' +

      '<div class="setting"><h2>A partner</h2>' + (S.partner ? '<p class="small">' + esc(S.partner) + " approves changes that protect you less.</p>" : '<p class="small">Someone you trust can approve changes that protect you less, and see a summary you choose to share.</p>') + '<div><button class="btn quiet" data-go="partner">' + (S.partner ? "Manage your partner" : "Add a partner") + "</button></div></div>" +
      '<div class="setting"><h2>When protection is active</h2><label class="opt"><input type="radio" name="sched" value="always"' + (S.schedule === "always" ? " checked" : "") + '><span>All the time</span></label><label class="opt"><input type="radio" name="sched" value="windows"' + (S.schedule === "windows" ? " checked" : "") + '><span>On a schedule<br><span class="small">Weekdays 09:00–17:00 and every evening 20:00–23:30. Ending a window early waits like any other change.</span></span></label></div>' +
      '<div class="setting"><h2>Counting reaches</h2><label class="opt"><input type="radio" name="mode" value="counted"' + (S.mode === "counted" ? " checked" : "") + '><span>Counted<br><span class="small">Cairn notes the site and the time, and nothing else. Nothing is shown to the site.</span></span></label><label class="opt"><input type="radio" name="mode" value="silent"' + (S.mode === "silent" ? " checked" : "") + '><span>Silent<br><span class="small">Pure blocking, nothing noted. Tonight asks you to estimate instead.</span></span></label></div>' +

      "</section>";

  // ---------- render + events ----------

  app.addEventListener("click", function (e) {

  app.addEventListener("change", function (e) {

      if (!t.checked && S.status === "in_force") {
        t.checked = true; S.note = "Switch the " + CATS.filter(function (x) { return x[0] === c; })[0][1] + " list off: this takes effect in 23 hours, and protection stays on until then.";
        S.pending = "Switch the " + CATS.filter(function (x) { return x[0] === c; })[0][1] + " list off";
      } else { S.cats[c] = t.checked; S.note = ""; }
      return render();
    }
    if (t.name === "streak") { S.streaks = t.value === "on"; return; }
    if (t.name === "mode") { S.mode = t.value; return render(); }
    if (t.name === "sched") { S.schedule = t.value; return; }
    if (t.id === "waiting") { S.waiting = t.value; return render(); }
    if (t.id === "wa") { if (t.checked) { t.checked = false; S.workaroundsAsk = true; } else { S.workarounds = false; } return render(); }
    if (t.id === "streak-t") { S.streaks = t.checked; return; }
    if (t.id === "auto") { S.autostart = t.checked; return; }
    if (t.id === "from") { S.from = t.value; return render(); }
    if (t.id === "to") { S.to = t.value; return render(); }
  });

  app.addEventListener("input", function (e) {
    if (e.target.id === "journal") { var b = document.getElementById("keep"); b.disabled = !e.target.value.trim(); document.getElementById("kept").textContent = ""; }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "custom-form") {
      var raw = document.getElementById("custom").value.trim(), d = raw.toLowerCase().replace(/^[a-z]+:\/\//, "").split(/[/:?#]/)[0].replace(/^www\./, "");
      if (!raw) S.customMsg = ["no", "Type an address to protect, like example.com."];
      else if (d === "localhost") S.customMsg = ["no", "Cairn keeps localhost working — the machine and Cairn itself use it to reach things on this computer. Try the address of a site instead."];
      else if (d.indexOf("*") >= 0) S.customMsg = ["no", "Cairn protects one address at a time, so * will not work here. Add the addresses you want protected individually."];
      else if (/^[\d.]+$/.test(d)) S.customMsg = ["no", "That is a numeric address rather than a site name. Cairn protects names like example.com."];
      else if (d.indexOf(".") < 0) S.customMsg = ["no", d + " looks like a single word rather than a web address. Try example.com."];
      else {
        if (S.custom.indexOf(d) < 0) S.custom.push(d);
        S.customMsg = ["ok", (on() ? "Protected: " : "Added — Cairn will protect these once protection is on: ") + d + ", www." + d];
      }
      return render();
    }
    if (e.target.id === "partner-form") { var n = document.getElementById("pname").value.trim(); if (!n || !document.getElementById("ppass").value) return; S.partner = n; return render(); }
  });

  // ---------- the prototype's own record: who accepted which screen ----------
  var accepts = {}, db = null, user = null, comments = null, myId = null, names = {}, canWrite = null;
  var accBtn = document.getElementById("proto-accept"), accLine = document.getElementById("proto-acc"), cmtBtn = document.getElementById("proto-comment");
  function paintAccept() {
    var a = accepts[S.screen];
    accBtn.setAttribute("aria-pressed", a ? "true" : "false");
    accBtn.textContent = a ? "Accepted" : "Accept this screen";
    var viewOnly = canWrite === false;
    accLine.textContent = a ? "by " + (names[a.by] || "someone") + ", " + new Date(a.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })
      : viewOnly ? "You can view this page but not accept screens. Ask the person who shared it for access that can use the page."
      : (db ? "" : "Accepting is recorded only when this page is opened on claude.ai.");
    accBtn.disabled = !db || viewOnly;
  }
  async function resolveNames() {
    if (!user) return;
    var ids = Object.keys(accepts).map(function (k) { return accepts[k].by; }).filter(Boolean);
    if (!ids.length) return;
    try { var ps = await user.profiles(ids); ids.forEach(function (id) { names[id] = (ps[id] && ps[id].name) || "someone"; }); } catch (_) {}
    paintAccept();
  }
  accBtn.addEventListener("click", async function () {
    if (!db || !myId) return;
    var ref = db.doc("accepts/" + S.screen);
    try {
      if (accepts[S.screen]) await ref.delete();
      else await ref.set({ by: myId, at: new Date().toISOString(), screen: S.screen });
    } catch (_) { accLine.textContent = "That was not recorded. Accepting needs access that can use this page; ask the person who shared it."; }
  });
  cmtBtn.addEventListener("click", async function () {
    if (!comments) return;
    try { await comments.openComposer({ element: app.querySelector("section.card") || app }); } catch (_) { cmtBtn.hidden = true; }
  });

  render();

  (async function () {
    if (!window.claude || !window.claude.use) return;
    try { comments = await window.claude.use("comments"); if (comments) cmtBtn.hidden = false; } catch (_) {}
    try { user = await window.claude.use("user"); if (user) { myId = await user.id(); canWrite = await user.can("data.write"); } } catch (_) {}
    try {
      db = await window.claude.use("db");
      if (db) db.collection("accepts").onSnapshot(function (snap) {
        accepts = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v) accepts[d.id] = v; });
        paintAccept(); resolveNames();
      });
    } catch (_) { db = null; }
    paintAccept();
  })();
})();
</script>
